[package]
name = "updt"
version = "1.1.0"
edition = "2024"
description = "Cross-platform update helper for npm, cargo, rustup, scoop, Homebrew, paru, flatpak, pacman, and pkg."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jihaohaaaa/updt"
repository = "https://github.com/jihaohaaaa/updt"
documentation = "https://docs.rs/updt"
keywords = ["update", "system", "package-manager", "cli", "automation"]
categories = ["command-line-utilities"]

[dependencies]
clap = "4.6"
ratatui = "0.30"
chrono = { version = "0.4", default-features = true }
serde_json = "1.0"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
