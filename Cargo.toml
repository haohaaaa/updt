[package]
name = "updt"
version = "5.0.0"
edition = "2024"
description = "Cross-platform update helper for npm, cargo, rustup, scoop, Homebrew, paru, flatpak, pacman, DNF, and pkg."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/haohaaaa/updt"
repository = "https://github.com/haohaaaa/updt"
documentation = "https://docs.rs/updt"
keywords = ["update", "system", "package-manager", "cli", "automation"]
categories = ["command-line-utilities"]

[dependencies]
clap = "4.6"
clap_complete = "4.6"
chrono = { version = "0.4", default-features = true }
serde_json = "1.0"
crossterm = "0.29"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
indicatif = "0.18"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.2"
portable-pty = "0.9"
vt100 = "0.18"

[build-dependencies]
clap = "4.6"
clap_complete = "4.6"
